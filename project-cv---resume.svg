e cx="512" cy="129" r="37" fill="none" stroke="#193447" stroke-width="6"/><circle cx="512" cy="129" r="37" fill="none" stroke="#b597ff" stroke-width="6" stroke-linecap="round" stroke-dasharray="158.78 232.48" transform="rotate(-90 512 129)"/><text x="512" y="135" font-family="'DejaVu Sans Mono',monospace" font-size="18" fill="#eef6ff" font-weight="700" text-anchor="middle">68.3%</text><text x="512" y="188" font-family="'DejaVu Sans Mono',monospace" font-size="9" fill="#b597ff" font-weight="400" text-anchor="middle">CSS SHARE</text><rect x="28" y="246" width="532" height="1" rx="0" fill="#213f52" stroke="none" /><text x="28" y="269" font-family="'DejaVu Sans Mono',monospace" font-size="10" fill="#91a5ba" font-weight="400" >☆ 0 STARS  ·  PUBLIC</text><text x="560" y="269" font-family="'DejaVu Sans Mono',monospace" font-size="10" fill="#91a5ba" font-weight="400" text-anchor="end">UPDATED 2026-10-24</text></svg>
