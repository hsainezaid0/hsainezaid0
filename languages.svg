<svg xmlns="http://www.w3.org/2000/svg" width="588" height="340" viewBox="0 0 588 340" role="img" aria-labelledby="title"><title id="title">Languages used in public repositories</title><defs>
      <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#101f31"/><stop offset="1" stop-color="#08111e"/></linearGradient>
      <linearGradient id="accent"><stop stop-color="#54efb5"/><stop offset=".5" stop-color="#65d8ff"/><stop offset="1" stop-color="#b597ff"/></linearGradient>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21364a"/></pattern>
      <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H6" stroke="#fff" stroke-opacity=".025"/></pattern>
    </defs><style>
      @keyframes blink {0%,45%,100%{opacity:1}50%,95%{opacity:.12}}
      @keyframes hover {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes shot {from{transform:translateY(100px);opacity:0}20%{opacity:1}to{transform:translateY(-110px);opacity:0}}
      @keyframes fleet {0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
      @keyframes knight {0%,35%,100%{transform:translate(0,0)}45%,80%{transform:translate(58px,-29px)}}
      .blink{animation:blink 2s infinite}.float{animation:hover 4s ease-in-out infinite}.shot{animation:shot 1.8s linear infinite}.fleet{animation:fleet 5s ease-in-out infinite}.knight{animation:knight 7s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style><rect x="1" y="1" width="586" height="338" rx="20" fill="url(#panel)" stroke="#2d465d" /><rect x="1" y="1" width="586" height="47" rx="20" fill="#101c2a" stroke="none" /><circle cx="25" cy="25" r="4" fill="#ff6b89"/><circle cx="42" cy="25" r="4" fill="#ffcf67"/><circle cx="59" cy="25" r="4" fill="#54efb5"/><text x="88" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="13" fill="#91a5ba" font-weight="400" >LANGUAGE STACK</text><text x="562" y="30" font-family="'DejaVu Sans Mono',monospace" font-size="11" fill="#617c95" font-weight="400" text-anchor="end">stack.scan</text><text x="30" y="101" font-family="'DejaVu Sans',sans-serif" font-size="25" fill="#b597ff" font-weight="700" >First scan pending</text><text x="30" y="134" font-family="'DejaVu Sans',sans-serif" font-size="13" fill="#91a5ba" font-weight="400" >Public repository language scan</text><rect x="30" y="162" width="528" height="1" rx="0" fill="#284055" stroke="none" /><text x="30" y="199" font-family="'DejaVu Sans Mono',monospace" font-size="15" fill="#54efb5" font-weight="400" >$ language_scan --public</text><text x="30" y="230" font-family="'DejaVu Sans',sans-serif" font-size="15" fill="#eef6ff" font-weight="400" >Byte-based percentages will appear</text><text x="30" y="256" font-family="'DejaVu Sans',sans-serif" font-size="15" fill="#eef6ff" font-weight="400" >after the first GitHub Actions run.</text><text x="30" y="314" font-family="'DejaVu Sans Mono',monospace" font-size="10" fill="#91a5ba" font-weight="400" >SOURCE: PUBLIC REPOSITORY · SYNC PENDING</text></svg>
